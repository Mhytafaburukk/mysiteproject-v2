<!DOCTYPE html>
<html lang="tr">

<head>
    <title>Kelime & Yapay Zeka Testi</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --secondary: #06b6d4;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.9);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 15%, #1e1b4b 0%, #0f172a 100%);
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        /* Navigasyon Barı (Mobil Uyumlu) */
        .nav-container {
            display: flex;
            gap: 10px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid var(--card-border);
            max-width: 95%;
            overflow-x: auto;
            white-space: nowrap;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .nav-container::-webkit-scrollbar { display: none; }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.25s;
        }

        .nav-link:hover, .nav-link.active {
            color: #ffffff;
            background: var(--primary);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
        }

        /* Ana Kart */
        .quiz-card {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 18px;
            text-align: center;
        }

        /* Mod Değiştirici Sekmeler (Tabs) */
        .tab-switch {
            display: flex;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 16px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            gap: 6px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.25s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
        }

        /* Soru Başlığı ve Metinleri */
        .question-badge {
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #38bdf8;
            font-weight: 600;
        }

        .target-phrase {
            font-size: 1.85rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
            margin: 4px 0;
        }

        .sentence-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            font-size: 1.12rem;
            line-height: 1.6;
            color: #f1f5f9;
            text-align: left;
            position: relative;
        }

        .blank-space {
            color: #f59e0b;
            font-weight: 700;
            text-decoration: underline;
        }

        /* Seçenekler Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }

        .option-btn {
            background: rgba(15, 23, 42, 0.7);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #f8fafc;
            font-weight: 500;
            text-align: center;
        }

        .option-btn:hover {
            border-color: #6366f1;
            background: rgba(79, 70, 229, 0.2);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background: rgba(16, 185, 129, 0.3) !important;
            border-color: #10b981 !important;
            color: #34d399 !important;
            font-weight: 700;
        }

        .option-btn.wrong {
            background: rgba(239, 68, 68, 0.3) !important;
            border-color: #ef4444 !important;
            color: #f87171 !important;
        }

        /* Açıklama Kartı */
        .explanation-card {
            background: rgba(15, 23, 42, 0.7);
            border-left: 4px solid #38bdf8;
            padding: 14px;
            border-radius: 10px;
            text-align: left;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #cbd5e1;
            display: none;
            margin-top: 10px;
        }

        /* AI Giriş Barı */
        .ai-input-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .ai-input {
            flex: 1;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 14px;
            border-radius: 12px;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }
        .ai-input:focus { border-color: #6366f1; }

        .btn-ai-generate {
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-ai-generate:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4); }

        .btn-action-primary {
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn-action-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 25px;
            color: #64748b;
            font-size: 0.85rem;
            text-align: center;
        }

        @media (max-width: 600px) {
            .quiz-card { padding: 20px 14px; border-radius: 18px; }
            .options-grid { grid-template-columns: 1fr; }
            .target-phrase { font-size: 1.5rem; }
            .sentence-box { font-size: 0.98rem; }
            .ai-input-bar { flex-direction: column; }
        }

        /* --- Inline SVG ikon rozetleri --- */
        .icon-badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px; border-radius: 7px;
            background: linear-gradient(135deg, rgba(108,92,231,.18), rgba(56,189,248,.12)), rgba(255,255,255,.06);
            border: 1px solid rgba(129,140,248,.32);
            color: #a5b4fc; flex-shrink: 0; vertical-align: -.28em; line-height: 0;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
        }
        .icon-badge svg { width: 13px; height: 13px; display: block; }
        .icon-badge--sm { width: 18px; height: 18px; border-radius: 6px; }
        .icon-badge--sm svg { width: 10.5px; height: 10.5px; }
        .icon-badge--lg { width: 30px; height: 30px; border-radius: 9px; }
        .icon-badge--lg svg { width: 17px; height: 17px; }
        .icon-inline { display: inline-block; vertical-align: -.18em; margin: 0 2px; }
        .icon-svg { display: block; }

        /* ==================================================================
           OBSIDIAN KELİME TESTİ
           ================================================================== */
        body {
            background:
                radial-gradient(1100px 560px at 50% -12%, rgba(124, 92, 255, 0.24), transparent 62%),
                radial-gradient(900px 520px at 100% 20%, rgba(91, 140, 255, 0.12), transparent 58%),
                #07080B;
        }

        .nav-container {
            background: rgba(20, 20, 24, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .nav-link:hover,
        .nav-link.active {
            background: linear-gradient(135deg, #7C5CFF, #5B8CFF);
            box-shadow: 0 8px 20px -10px rgba(124, 92, 255, 0.85);
        }

        .quiz-card {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.035) 0%, transparent 42%),
                #141418;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 26px;
            box-shadow:
                0 50px 100px -60px rgba(0, 0, 0, 0.95),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .tab-switch {
            background: rgba(9, 9, 13, 0.6);
            border-color: rgba(255, 255, 255, 0.07);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #7C5CFF, #5B8CFF);
            box-shadow: 0 8px 20px -10px rgba(124, 92, 255, 0.9);
        }

        .question-badge { color: #9B86FF; }

        .sentence-box {
            background: rgba(9, 9, 13, 0.62);
            border-color: rgba(255, 255, 255, 0.08);
            border-radius: 18px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
            border-radius: 14px;
        }

        .option-btn:hover {
            border-color: rgba(124, 92, 255, 0.65);
            background: rgba(124, 92, 255, 0.16);
            box-shadow: 0 12px 26px -16px rgba(124, 92, 255, 0.75);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background: rgba(52, 211, 153, 0.18) !important;
            border-color: #34D399 !important;
            color: #6EE7B7 !important;
        }

        .option-btn.wrong {
            background: rgba(242, 85, 90, 0.18) !important;
            border-color: #F2555A !important;
            color: #FF9AA0 !important;
        }

        .explanation-card {
            background: rgba(124, 92, 255, 0.08);
            border-left-color: #7C5CFF;
            border-radius: 12px;
        }

        .ai-input {
            background: rgba(9, 9, 13, 0.7);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .btn-ai-generate,
        .btn-action-primary {
            background: linear-gradient(135deg, #7C5CFF, #4F7CFF);
            box-shadow: 0 12px 26px -14px rgba(124, 92, 255, 0.9);
            border-radius: 12px;
        }

        .btn-action-primary:hover {
            background: linear-gradient(135deg, #9179FF, #5B8CFF);
        }

        .footer { color: #5C636E; }
    </style>
</head>

    <main class="quiz-card">
        <!-- DİL SEÇİM VE YÖN ÇUBUĞU -->
        <div id="kelimeLangBar" style="margin-bottom: 12px; display: flex; justify-content: center;"></div>

        <!-- MOD SEÇİCİ -->
        <div class="tab-switch">
            <button class="tab-btn active" id="tabClassic" onclick="switchMode('classic')"><span class="icon-badge icon-badge--sm" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"/></svg></span> Klasik Kelime Testi</button>
            <button class="tab-btn" id="tabAI" onclick="switchMode('ai')"><span class="icon-badge icon-badge--sm" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3Z"/><path d="M19 15l.6 1.7 1.7.6-1.7.6L19 19.6l-.6-1.7-1.7-.6 1.7-.6.6-1.7Z"/></svg></span> AI Boşluk Doldurma &amp; Soru</button>

            <div id="quiz-container">

        <!-- 2. YAPAY ZEKA DESTEKLİ BOŞLUK DOLDURMA ALANI -->
        <div id="ai-section" style="display: none; text-align: left;">
            <div class="ai-input-bar">
                <input type="text" id="aiWordInput" class="ai-input" placeholder="İstediğiniz kelimeyi girin (Örn: resilience, appointment)...">
                <button class="btn-ai-generate" onclick="fetchAIQuestion()"><span class="icon-badge icon-badge--sm" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3Z"/><path d="M19 15l.6 1.7 1.7.6-1.7.6L19 19.6l-.6-1.7-1.7-.6 1.7-.6.6-1.7Z"/></svg></span> AI İle Soru Üret</button>
            </div>

            <div id="aiQuestionBox" style="display: flex; flex-direction: column; gap: 14px;">

                <div class="sentence-box" id="aiSentence">

                </div>

                <div style="font-size: 0.88rem; color: #94a3b8; display:flex; justify-content:space-between; align-items:center;">
                    <span>Aşağıdaki şıklardan cümleye en uygun olanını seçin:</span>
                    <button onclick="speakSentence()" style="background:none; border:none; color:#38bdf8; cursor:pointer; font-size:0.9rem;"><span class="icon-badge icon-badge--sm" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a9 9 0 0 1 0 12"/></svg></span> Cümleyi Dinle</button>
                </div>

                <div class="options-grid" id="aiOptionsGrid"></div>

                <div class="explanation-card" id="aiExplanation">
                    <strong style="color: #38bdf8; display:block; margin-bottom:4px;"><span class="icon-badge icon-badge--sm" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3Z"/></svg></span> Türkçe Çeviri &amp; Açıklama:</strong>
                    <div id="aiExplanationText"></div>
                </div>

                <button class="btn-action-primary" onclick="fetchAIQuestion(true)" style="align-self: center; margin-top: 10px;">
                    Sonraki AI Soru <svg class="icon-inline" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>

    <script src="all_words.js"></script>
    <script src="languages.js"></script>
    <script src="design-system.js"></script>
    <script>
        const API_URL = window.location.origin;

        // --- KLASİK TEST MANTIĞI (DİL YÖNETİMİ ENTEGRELİ) ---
        let wordList = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let mistakes = [];
        let isRetrying = false;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function loadWordList() {
            if (typeof LanguageManager !== 'undefined') {
                wordList = LanguageManager.getWordList();
            } else if (typeof comprehensiveWordList !== 'undefined') {
                wordList = comprehensiveWordList;
            } else {
                wordList = [
                    { word: "approve", meaning: "onaylamak" },
                    { word: "appointment", meaning: "randevu" },
                    { word: "achievement", meaning: "başarı" },
                    { word: "resilience", meaning: "dayanıklılık" }
                ];
            }
            shuffle(wordList);
        }

        function restartQuiz() {
            loadWordList();
            currentQuestionIndex = 0;
            score = 0;
            mistakes = [];
            isRetrying = false;
            showQuestion();
        }

        document.addEventListener("DOMContentLoaded", () => {
            if (typeof LanguageManager !== 'undefined') {
                LanguageManager.renderBar("kelimeLangBar", {
                    onDirectionChange: restartQuiz,
                    onLanguageChange: restartQuiz
                });
            }
            restartQuiz();
        });

        function showQuestion() {
            const container = document.getElementById("quiz-container");

            if (currentQuestionIndex >= 10 && !isRetrying) {
                finishTest();
                return;
            }
            if (isRetrying && mistakes.length === 0) {
                finishTest();
                return;
            }

            let currentWord = isRetrying ? mistakes[0] : wordList[currentQuestionIndex];
            
            let options = [currentWord.meaning];
            while (options.length < 4 && options.length < wordList.length) {
                const randomWord = wordList[Math.floor(Math.random() * wordList.length)];
                if (!options.includes(randomWord.meaning)) options.push(randomWord.meaning);
            }
            shuffle(options);

            const prefs = (typeof LanguageManager !== 'undefined') ? LanguageManager.getPreferences() : { learningLang: 'en', nativeLang: 'tr', direction: 'learning_to_native' };
            const targetLangCode = (prefs.direction === 'native_to_learning') ? prefs.learningLang : prefs.nativeLang;
            const targetMeta = (typeof LanguageManager !== 'undefined') ? LanguageManager.getLanguageMeta(targetLangCode) : { name: 'Türkçe', flag: '🇹🇷' };

            const safeTargetWord = (currentWord.word || "").replace(/'/g, "\\'");
            const safeCorrectMeaning = (currentWord.meaning || "").replace(/'/g, "\\'");

            container.innerHTML = `
                <div class="question-badge">Soru ${isRetrying ? "(Tekrar)" : currentQuestionIndex + 1} / 10</div>
                <h2 class="target-phrase">${currentWord.word}</h2>
                <p style="color: var(--text-muted); font-size:0.95rem; margin-bottom:12px;">Bu kelimenin <strong>${targetMeta.flag} ${targetMeta.name}</strong> karşılığı nedir?</p>
                <div class="options-grid">
                    ${options.map(opt => {
                        const safeOpt = (opt || "").replace(/'/g, "\\'");
                        return `<button class="option-btn" onclick="checkAnswer(this, '${safeOpt}', '${safeCorrectMeaning}')">${opt}</button>`;
                    }).join('')}
                </div>
            `;
        }

        function checkAnswer(btn, selected, correct) {
            const allBtns = document.querySelectorAll(".options-grid .option-btn");
            allBtns.forEach(b => b.disabled = true);

            if (selected === correct) {
                btn.classList.add("correct");
                if (!isRetrying) score++;
                if (isRetrying) mistakes.shift();
            } else {
                btn.classList.add("wrong");
                allBtns.forEach(b => {
                    if (b.textContent === correct) b.classList.add("correct");
                });
                if (!isRetrying) {
                    mistakes.push(wordList[currentQuestionIndex]);
                } else {
                    const wrongWord = mistakes.shift();
                    mistakes.push(wrongWord);
                }
            }

            setTimeout(() => {
                if (!isRetrying) currentQuestionIndex++;
                showQuestion();
            }, 800);
        }

        function finishTest() {
            const container = document.getElementById("quiz-container");
            const finalScore = isRetrying ? 10 : score;

            container.innerHTML = `
                <h2 class="target-phrase" style="color: #34d399;">Test Tamamlandı! 🎉</h2>
                <p style="color: #cbd5e1; font-size: 1.1rem; margin: 15px 0;">Skorunuz: <strong>${finalScore} / 10</strong></p>
                ${mistakes.length > 0 && !isRetrying ? `
                    <p style="color: #f87171;">${mistakes.length} kelimede hata yaptınız.</p>
                    <button class="btn-action-primary" onclick="retryMistakes()">Hataları Tekrar Et 🔄</button>
                ` : `
                    <button class="btn-action-primary" onclick="location.reload()">Yeniden Başla 🔄</button>
                `}
            `;
        }

        function retryMistakes() {
            isRetrying = true;
            showQuestion();
        }

        // --- SEKME GEÇİŞİ (TABS) ---
        function switchMode(mode) {
            const tabClassic = document.getElementById("tabClassic");
            const tabAI = document.getElementById("tabAI");
            const classicSec = document.getElementById("classic-section");
            const aiSec = document.getElementById("ai-section");

            if (mode === 'classic') {
                tabClassic.classList.add("active");
                tabAI.classList.remove("active");
                classicSec.style.display = "block";
                aiSec.style.display = "none";
            } else {
                tabAI.classList.add("active");
                tabClassic.classList.remove("active");
                classicSec.style.display = "none";
                aiSec.style.display = "block";
                fetchAIQuestion();
            }
        }

        // --- AI SORU ÜRETİCİ MANTIĞI ---
        let currentAIQuestionData = null;

        async function fetchAIQuestion(random = false) {
            const input = document.getElementById("aiWordInput");
            const word = random ? "" : input.value.trim();
            if (random) input.value = "";

            const sentenceBox = document.getElementById("aiSentence");
            const optionsGrid = document.getElementById("aiOptionsGrid");
            const explanationBox = document.getElementById("aiExplanation");

            sentenceBox.innerHTML = "🤖 Yapay Zeka soru üretiyor, lütfen bekleyin...";
            optionsGrid.innerHTML = "";
            explanationBox.style.display = "none";

            try {
                const res = await fetch(`${API_URL}/api/ai/generate-question`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ word: word, type: "fill_in_the_blank" })
                });
                const data = await res.json();
                currentAIQuestionData = data;

                renderAIQuestion(data);
            } catch (e) {
                sentenceBox.innerHTML = "Soru üretilirken hata oluştu. Lütfen tekrar deneyin.";
            }
        }

        function renderAIQuestion(q) {
            const sentenceBox = document.getElementById("aiSentence");
            const optionsGrid = document.getElementById("aiOptionsGrid");
            const explanationBox = document.getElementById("aiExplanation");

            const formattedSentence = q.sentence.replace("_______", `<span class="blank-space">_______</span>`);
            sentenceBox.innerHTML = formattedSentence;

            optionsGrid.innerHTML = q.options.map(opt => `
                <button class="option-btn" onclick="checkAIAnswer(this, '${opt}', '${q.correctAnswer}')">
                    ${opt}
                </button>
            `).join("");

            explanationBox.style.display = "none";
        }

        function checkAIAnswer(btn, selected, correct) {
            const allBtns = document.querySelectorAll("#aiOptionsGrid .option-btn");
            allBtns.forEach(b => b.disabled = true);

            const explanationBox = document.getElementById("aiExplanation");
            const explanationText = document.getElementById("aiExplanationText");

            if (selected.toLowerCase() === correct.toLowerCase()) {
                btn.classList.add("correct");
            } else {
                btn.classList.add("wrong");
                allBtns.forEach(b => {
                    if (b.textContent.trim().toLowerCase() === correct.toLowerCase()) b.classList.add("correct");
                });
            }

            // Cümledeki boşluğu doldur
            const sentenceBox = document.getElementById("aiSentence");
            sentenceBox.innerHTML = currentAIQuestionData.sentence.replace("_______", `<strong style="color:#10b981;">${correct}</strong>`);

            explanationText.innerHTML = `
                <div>🇹🇷 <strong>Çeviri:</strong> ${currentAIQuestionData.turkishHint}</div>
                <div style="margin-top:6px;">📖 <strong>Detay:</strong> ${currentAIQuestionData.explanation}</div>
            `;
            explanationBox.style.display = "block";
        }

        function speakSentence() {
            if (currentAIQuestionData && 'speechSynthesis' in window) {
                const text = currentAIQuestionData.sentence.replace("_______", currentAIQuestionData.correctAnswer);
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'en-US';
                window.speechSynthesis.speak(utter);
            }
        }
    </script>
</body>

</html>
