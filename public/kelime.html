<!DOCTYPE html>
<html lang="tr">

<head>
    <title>Kelime & Yapay Zeka Testi</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --secondary: #06b6d4;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.9);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 15%, #1e1b4b 0%, #0f172a 100%);
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        /* Navigasyon Barı (Mobil Uyumlu) */
        .nav-container {
            display: flex;
            gap: 10px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid var(--card-border);
            max-width: 95%;
            overflow-x: auto;
            white-space: nowrap;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .nav-container::-webkit-scrollbar { display: none; }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.25s;
        }

        .nav-link:hover, .nav-link.active {
            color: #ffffff;
            background: var(--primary);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
        }

        /* Ana Kart */
        .quiz-card {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 18px;
            text-align: center;
        }

        /* Mod Değiştirici Sekmeler (Tabs) */
        .tab-switch {
            display: flex;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 16px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            gap: 6px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.25s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
        }

        /* Soru Başlığı ve Metinleri */
        .question-badge {
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #38bdf8;
            font-weight: 600;
        }

        .target-phrase {
            font-size: 1.85rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
            margin: 4px 0;
        }

        .sentence-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            font-size: 1.12rem;
            line-height: 1.6;
            color: #f1f5f9;
            text-align: left;
            position: relative;
        }

        .blank-space {
            color: #f59e0b;
            font-weight: 700;
            text-decoration: underline;
        }

        /* Seçenekler Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }

        .option-btn {
            background: rgba(15, 23, 42, 0.7);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #f8fafc;
            font-weight: 500;
            text-align: center;
        }

        .option-btn:hover {
            border-color: #6366f1;
            background: rgba(79, 70, 229, 0.2);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background: rgba(16, 185, 129, 0.3) !important;
            border-color: #10b981 !important;
            color: #34d399 !important;
            font-weight: 700;
        }

        .option-btn.wrong {
            background: rgba(239, 68, 68, 0.3) !important;
            border-color: #ef4444 !important;
            color: #f87171 !important;
        }

        /* Açıklama Kartı */
        .explanation-card {
            background: rgba(15, 23, 42, 0.7);
            border-left: 4px solid #38bdf8;
            padding: 14px;
            border-radius: 10px;
            text-align: left;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #cbd5e1;
            display: none;
            margin-top: 10px;
        }

        /* AI Giriş Barı */
        .ai-input-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .ai-input {
            flex: 1;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 14px;
            border-radius: 12px;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }
        .ai-input:focus { border-color: #6366f1; }

        .btn-ai-generate {
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-ai-generate:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4); }

        .btn-action-primary {
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn-action-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 25px;
            color: #64748b;
            font-size: 0.85rem;
            text-align: center;
        }

        @media (max-width: 600px) {
            .quiz-card { padding: 20px 14px; border-radius: 18px; }
            .options-grid { grid-template-columns: 1fr; }
            .target-phrase { font-size: 1.5rem; }
            .sentence-box { font-size: 0.98rem; }
            .ai-input-bar { flex-direction: column; }
        }
    </style>
</head>

<body>

    <nav class="nav-container">
        <a href="girisliindex.html" class="nav-link">Anasayfa</a>
        <a href="kelime.html" class="nav-link active">Kelime & AI Testi</a>
        <a href="dinleme_testi.html" class="nav-link">Kelime Eşleştirme</a>
        <a href="Message.html" class="nav-link">Mesajlar & AI</a>
        <a href="TumKelimeler.html" class="nav-link">Kelime Listesi</a>
    </nav>

    <main class="quiz-card">
        <!-- MOD SEÇİCİ -->
        <div class="tab-switch">
            <button class="tab-btn active" id="tabClassic" onclick="switchMode('classic')">📝 Klasik Kelime Testi</button>
            <button class="tab-btn" id="tabAI" onclick="switchMode('ai')">🤖 AI Boşluk Doldurma & Soru</button>
        </div>

        <!-- 1. KLASİK TEST ALANI -->
        <div id="classic-section">
            <div id="quiz-container">
                Test Başlatılıyor...
            </div>
        </div>

        <!-- 2. YAPAY ZEKA DESTEKLİ BOŞLUK DOLDURMA ALANI -->
        <div id="ai-section" style="display: none; text-align: left;">
            <div class="ai-input-bar">
                <input type="text" id="aiWordInput" class="ai-input" placeholder="İstediğiniz kelimeyi girin (Örn: resilience, appointment)...">
                <button class="btn-ai-generate" onclick="fetchAIQuestion()">✨ AI İle Soru Üret</button>
            </div>

            <div id="aiQuestionBox" style="display: flex; flex-direction: column; gap: 14px;">
                <div class="question-badge">🤖 Yapay Zeka Boşluk Doldurma Sorusu</div>
                
                <div class="sentence-box" id="aiSentence">
                    Yükleniyor...
                </div>

                <div style="font-size: 0.88rem; color: #94a3b8; display:flex; justify-content:space-between; align-items:center;">
                    <span>Aşağıdaki şıklardan cümleye en uygun olanını seçin:</span>
                    <button onclick="speakSentence()" style="background:none; border:none; color:#38bdf8; cursor:pointer; font-size:0.9rem;">🔊 Cümleyi Dinle</button>
                </div>

                <div class="options-grid" id="aiOptionsGrid"></div>

                <div class="explanation-card" id="aiExplanation">
                    <strong style="color: #38bdf8; display:block; margin-bottom:4px;">💡 Türkçe Çeviri & Açıklama:</strong>
                    <div id="aiExplanationText"></div>
                </div>

                <button class="btn-action-primary" onclick="fetchAIQuestion(true)" style="align-self: center; margin-top: 10px;">
                    Sonraki AI Soru ➔
                </button>
            </div>
        </div>
    </main>

    <footer class="footer">
        © 2024 English Learning Platform
    </footer>

    <script src="all_words.js"></script>
    <script>
        const API_URL = window.location.origin;

        // --- KLASİK TEST MANTIĞI ---
        const wordList = (typeof comprehensiveWordList !== 'undefined') ? comprehensiveWordList : [
            { word: "approve", meaning: "onaylamak" },
            { word: "appointment", meaning: "randevu" },
            { word: "achievement", meaning: "başarı" },
            { word: "resilience", meaning: "dayanıklılık" }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let mistakes = [];
        let isRetrying = false;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            shuffle(wordList);
            showQuestion();
        });

        function showQuestion() {
            const container = document.getElementById("quiz-container");

            if (currentQuestionIndex >= 10 && !isRetrying) {
                finishTest();
                return;
            }
            if (isRetrying && mistakes.length === 0) {
                finishTest();
                return;
            }

            let currentWord = isRetrying ? mistakes[0] : wordList[currentQuestionIndex];
            
            let options = [currentWord.meaning];
            while (options.length < 4) {
                const randomWord = wordList[Math.floor(Math.random() * wordList.length)];
                if (!options.includes(randomWord.meaning)) options.push(randomWord.meaning);
            }
            shuffle(options);

            container.innerHTML = `
                <div class="question-badge">Soru ${isRetrying ? "(Tekrar)" : currentQuestionIndex + 1} / 10</div>
                <h2 class="target-phrase">${currentWord.word}</h2>
                <p style="color: var(--text-muted); font-size:0.95rem; margin-bottom:12px;">Bu kelimenin Türkçe karşılığı nedir?</p>
                <div class="options-grid">
                    ${options.map(opt => `<button class="option-btn" onclick="checkAnswer(this, '${opt}', '${currentWord.meaning}')">${opt}</button>`).join('')}
                </div>
            `;
        }

        function checkAnswer(btn, selected, correct) {
            const allBtns = document.querySelectorAll(".options-grid .option-btn");
            allBtns.forEach(b => b.disabled = true);

            if (selected === correct) {
                btn.classList.add("correct");
                if (!isRetrying) score++;
                if (isRetrying) mistakes.shift();
            } else {
                btn.classList.add("wrong");
                allBtns.forEach(b => {
                    if (b.textContent === correct) b.classList.add("correct");
                });
                if (!isRetrying) {
                    mistakes.push(wordList[currentQuestionIndex]);
                } else {
                    const wrongWord = mistakes.shift();
                    mistakes.push(wrongWord);
                }
            }

            setTimeout(() => {
                if (!isRetrying) currentQuestionIndex++;
                showQuestion();
            }, 800);
        }

        function finishTest() {
            const container = document.getElementById("quiz-container");
            const finalScore = isRetrying ? 10 : score;

            container.innerHTML = `
                <h2 class="target-phrase" style="color: #34d399;">Test Tamamlandı! 🎉</h2>
                <p style="color: #cbd5e1; font-size: 1.1rem; margin: 15px 0;">Skorunuz: <strong>${finalScore} / 10</strong></p>
                ${mistakes.length > 0 && !isRetrying ? `
                    <p style="color: #f87171;">${mistakes.length} kelimede hata yaptınız.</p>
                    <button class="btn-action-primary" onclick="retryMistakes()">Hataları Tekrar Et 🔄</button>
                ` : `
                    <button class="btn-action-primary" onclick="location.reload()">Yeniden Başla 🔄</button>
                `}
            `;
        }

        function retryMistakes() {
            isRetrying = true;
            showQuestion();
        }

        // --- SEKME GEÇİŞİ (TABS) ---
        function switchMode(mode) {
            const tabClassic = document.getElementById("tabClassic");
            const tabAI = document.getElementById("tabAI");
            const classicSec = document.getElementById("classic-section");
            const aiSec = document.getElementById("ai-section");

            if (mode === 'classic') {
                tabClassic.classList.add("active");
                tabAI.classList.remove("active");
                classicSec.style.display = "block";
                aiSec.style.display = "none";
            } else {
                tabAI.classList.add("active");
                tabClassic.classList.remove("active");
                classicSec.style.display = "none";
                aiSec.style.display = "block";
                fetchAIQuestion();
            }
        }

        // --- AI SORU ÜRETİCİ MANTIĞI ---
        let currentAIQuestionData = null;

        async function fetchAIQuestion(random = false) {
            const input = document.getElementById("aiWordInput");
            const word = random ? "" : input.value.trim();
            if (random) input.value = "";

            const sentenceBox = document.getElementById("aiSentence");
            const optionsGrid = document.getElementById("aiOptionsGrid");
            const explanationBox = document.getElementById("aiExplanation");

            sentenceBox.innerHTML = "🤖 Yapay Zeka soru üretiyor, lütfen bekleyin...";
            optionsGrid.innerHTML = "";
            explanationBox.style.display = "none";

            try {
                const res = await fetch(`${API_URL}/api/ai/generate-question`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ word: word, type: "fill_in_the_blank" })
                });
                const data = await res.json();
                currentAIQuestionData = data;

                renderAIQuestion(data);
            } catch (e) {
                sentenceBox.innerHTML = "Soru üretilirken hata oluştu. Lütfen tekrar deneyin.";
            }
        }

        function renderAIQuestion(q) {
            const sentenceBox = document.getElementById("aiSentence");
            const optionsGrid = document.getElementById("aiOptionsGrid");
            const explanationBox = document.getElementById("aiExplanation");

            const formattedSentence = q.sentence.replace("_______", `<span class="blank-space">_______</span>`);
            sentenceBox.innerHTML = formattedSentence;

            optionsGrid.innerHTML = q.options.map(opt => `
                <button class="option-btn" onclick="checkAIAnswer(this, '${opt}', '${q.correctAnswer}')">
                    ${opt}
                </button>
            `).join("");

            explanationBox.style.display = "none";
        }

        function checkAIAnswer(btn, selected, correct) {
            const allBtns = document.querySelectorAll("#aiOptionsGrid .option-btn");
            allBtns.forEach(b => b.disabled = true);

            const explanationBox = document.getElementById("aiExplanation");
            const explanationText = document.getElementById("aiExplanationText");

            if (selected.toLowerCase() === correct.toLowerCase()) {
                btn.classList.add("correct");
            } else {
                btn.classList.add("wrong");
                allBtns.forEach(b => {
                    if (b.textContent.trim().toLowerCase() === correct.toLowerCase()) b.classList.add("correct");
                });
            }

            // Cümledeki boşluğu doldur
            const sentenceBox = document.getElementById("aiSentence");
            sentenceBox.innerHTML = currentAIQuestionData.sentence.replace("_______", `<strong style="color:#10b981;">${correct}</strong>`);

            explanationText.innerHTML = `
                <div>🇹🇷 <strong>Çeviri:</strong> ${currentAIQuestionData.turkishHint}</div>
                <div style="margin-top:6px;">📖 <strong>Detay:</strong> ${currentAIQuestionData.explanation}</div>
            `;
            explanationBox.style.display = "block";
        }

        function speakSentence() {
            if (currentAIQuestionData && 'speechSynthesis' in window) {
                const text = currentAIQuestionData.sentence.replace("_______", currentAIQuestionData.correctAnswer);
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'en-US';
                window.speechSynthesis.speak(utter);
            }
        }
    </script>
</body>

</html>
