<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İngilizce Kelime Testi - Kullanıcı Profili</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; background-color: #6482AD; }
        #container { padding: 20px; border-radius: 15px; width: 400px; text-align: center; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.1); color: white; position: relative; z-index: 10; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid white; object-fit: cover; margin-bottom: 10px; background: #eee; }
        .section { background: rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 15px; margin: 10px 0; }
        button { background: white; color: #333; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.3s; margin: 5px; }
        button:hover { background: #6a5acd; color: white; transform: translateY(-2px); }
        #backbutton { position: absolute; left: 10px; top: 10px; z-index: 30; } 
        .box { position: fixed; border-radius: 50%; z-index: 0; pointer-events: none; width: 10px; height: 10px; }
    </style>
</head>
<body>
    <div id="b1" class="box" style="box-shadow: 0 0 30px 15px #E2DAD6;"></div>
    <div id="b2" class="box" style="box-shadow: 0 0 30px 15px #76ABAE;"></div>

    <button id="backbutton" onclick="window.location.href='Profil.html'">Back</button>

    <div id="container">
        <img id="userImg" src="https://via.placeholder.com/100" class="profile-img">
        <h2 id="userNameTitle">Yükleniyor...</h2>
        
        <div class="section">
            <div id="followStats">
                <span id="followerCount">0</span> Takipçi | <span id="followingCount">0</span> Takip Edilen
            </div>
        </div>

        <div class="section">
            <h3>Hakkında</h3>
            <button id="Favorikelime">Favori Kelimeleri Gör</button>
            <div id="content1" style="margin-top:10px; font-size: 14px;"></div>
        </div>

        <div class="section">
            <button id="followBtn">Takip Et</button>
            <button id="messageBtn">Mesaj Gönder</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const API_URL = window.location.origin;
            const currentusername = localStorage.getItem("currentusername");
            const savedUsername = localStorage.getItem("username");

            if (!currentusername) { window.location.href = "Profil.html"; return; }

            // Bilgileri Getir (Profil Resmi Dahil)
            fetch(`${API_URL}/get-user-info/${currentusername}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById("userNameTitle").textContent = data.user.username;
                        
                        // RESİM BURADA GÜNCELLENİYOR
                        if (data.user.profilePic) {
                            document.getElementById("userImg").src = data.user.profilePic;
                        }

                        document.getElementById("followerCount").textContent = (data.user.followers || []).length;
                        document.getElementById("followingCount").textContent = (data.user.following || []).length;

                        if (data.user.followers && data.user.followers.includes(savedUsername)) {
                            const btn = document.getElementById("followBtn");
                            btn.textContent = "Takip Ediliyor";
                            btn.disabled = true;
                        }
                    }
                });

            // Takip Et Butonu
            document.getElementById("followBtn").onclick = function() {
                fetch(`${API_URL}/follow`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ follower: savedUsername, target: currentusername })
                })
                .then(res => res.json())
                .then(data => {
                    if(data.success) {
                        alert("Takip edildi!");
                        location.reload();
                    }
                });
            };

            document.getElementById("messageBtn").onclick = () => window.location.href = "Message.html";

            document.getElementById("Favorikelime").onclick = function() {
                fetch(`${API_URL}/get-favorites/${currentusername}`)
                    .then(res => res.json())
                    .then(data => {
                        const words = data.favorikelimeler || [];
                        document.getElementById("content1").innerHTML = words.length > 0 ? words.join(", ") : "Henüz favori kelimesi yok.";
                    });
            };

            function move(id) {
                let x = Math.random()*window.innerWidth, y = Math.random()*window.innerHeight, dx=2, dy=2;
                setInterval(() => {
                    x+=dx; y+=dy;
                    if(x<0 || x>window.innerWidth) dx*=-1;
                    if(y<0 || y>window.innerHeight) dy*=-1;
                    const el = document.getElementById(id);
                    if(el) { el.style.left = x+'px'; el.style.top = y+'px'; }
                }, 50);
            }
            move("b1"); move("b2");
        });
    </script>
</body>
</html>
