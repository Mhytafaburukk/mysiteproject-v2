<!DOCTYPE html>
<html lang="tr">
<head>
    <title>Yönetici Girişi - Admin</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #1a1a2e; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .admin-box { background: rgba(255, 255, 255, 0.1); padding: 2rem; border-radius: 20px; backdrop-filter: blur(10px); width: 90%; max-width: 800px; text-align: center; border: 1px solid rgba(255,255,255,0.2); }
        .secure-input { padding: 12px; border-radius: 10px; border: none; width: 200px; margin-bottom: 10px; font-size: 16px; text-align: center; }
        .btn-verify { padding: 12px 25px; border-radius: 10px; border: none; background: #ff4d4d; color: white; cursor: pointer; font-weight: bold; }
        #adminContent { display: none; margin-top: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: white; color: #333; border-radius: 10px; overflow: hidden; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #008069; color: white; }
        tr:hover { background: #f1f1f1; }
        .back-link { color: #aaa; text-decoration: none; display: block; margin-top: 20px; font-size: 14px; }

        /* --- Inline SVG ikon rozetleri --- */
        .icon-badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px; border-radius: 7px;
            background: linear-gradient(135deg, rgba(108,92,231,.20), rgba(56,189,248,.12)), rgba(255,255,255,.08);
            border: 1px solid rgba(129,140,248,.32);
            color: #a5b4fc; flex-shrink: 0; vertical-align: -.28em; line-height: 0;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
        }
        .icon-badge svg { width: 13px; height: 13px; display: block; }
        .icon-badge--sm { width: 18px; height: 18px; border-radius: 6px; }
        .icon-badge--sm svg { width: 10.5px; height: 10.5px; }
        .icon-inline { display: inline-block; vertical-align: -.18em; margin: 0 2px; }

        /* ==================================================================
           OBSIDIAN ADMIN
           ================================================================== */
        body {
            background:
                radial-gradient(1000px 520px at 50% -10%, rgba(124, 92, 255, 0.24), transparent 62%),
                radial-gradient(800px 480px at 100% 20%, rgba(91, 140, 255, 0.14), transparent 60%),
                #07080B;
            color: #F4F5F7;
        }

        .admin-box {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.035) 0%, transparent 45%),
                rgba(20, 20, 24, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 24px;
            box-shadow:
                0 50px 110px -60px rgba(0, 0, 0, 0.95),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .admin-box h2 {
            background: linear-gradient(120deg, #C4B5FF 0%, #7C5CFF 50%, #5B8CFF 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-box p { color: #A7ADBA; }

        .secure-input {
            background: #0B0C10;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #FFFFFF;
            outline: none;
            transition: border-color 200ms ease, box-shadow 200ms ease;
        }

        .secure-input:focus {
            border-color: rgba(124, 92, 255, 0.7);
            box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.18);
        }

        .btn-verify {
            background: linear-gradient(135deg, #7C5CFF, #4F7CFF);
            border-radius: 12px;
            box-shadow: 0 14px 30px -14px rgba(124, 92, 255, 0.9);
            transition: transform 240ms cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 200ms ease;
        }

        .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 36px -14px rgba(124, 92, 255, 0.95);
        }

        table {
            background: #141418;
            color: #E5E7EB;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        th {
            background: rgba(124, 92, 255, 0.28);
            color: #FFFFFF;
            border-bottom-color: rgba(255, 255, 255, 0.08);
        }

        td { border-bottom-color: rgba(255, 255, 255, 0.06); }

        tr:hover { background: rgba(124, 92, 255, 0.08); }

        code { color: #C4B5FF; }

        .back-link { color: #8B929E; }

        .back-link:hover { color: #C4B5FF; }
    </style>
</head>
<body>

    <div class="admin-box">
        <div id="authArea">
            <h2><span class="icon-badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v5c0 5 3.4 8 8 10 4.6-2 8-5 8-10V6l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg></span> Admin Güvenlik Doğrulaması</h2>
            <p>Lütfen devam etmek için yönetici parolasını girin.</p>
            <input type="password" id="adminPass" class="secure-input" placeholder="Yönetici Şifresi">
            <br>
            <button onclick="verifyAdmin()" class="btn-verify">Yetkiyi Doğrula</button>
        </div>

        <div id="adminContent">
            <h3>Kullanıcı Veritabanı Yedekleme</h3>
            <table>
                <thead>
                    <tr>
                        <th>Kullanıcı Adı</th>
                        <th>Şifre (SHA-256 Hash)</th>
                        <th>Kelimeler</th>
                    </tr>
                </thead>
                <tbody id="userList"></tbody>
            </table>
        </div>
        <a href="girisliindex.html" class="back-link"><svg class="icon-inline" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg> Panele Geri Dön</a>
    </div>

    <script src="design-system.js"></script>
    <script>
        const API_URL = window.location.origin;
        const ADMIN_SECRET = "6864hatay1071";

        async function verifyAdmin() {
            const input = document.getElementById("adminPass").value;
            const currentUsername = localStorage.getItem("username");

            // 1. Güvenlik: Kullanıcı Burak mı?
            if (currentUsername !== "Burak") {
                alert("Bu işlem için yetkiniz yok!");
                window.location.href = "girisliindex.html";
                return;
            }

            // 2. Güvenlik: İkinci şifre doğru mu?
            if (input === ADMIN_SECRET) {
                document.getElementById("authArea").style.display = "none";
                document.getElementById("adminContent").style.display = "block";
                loadUsers();
            } else {
                alert("Hatalı yönetici şifresi!");
            }
        }

        async function loadUsers() {
            try {
                // Sunucuda admin-get-all-users rotası tanımlı olmalı (Bir önceki mesajda verdiğim server kodu)
                const res = await fetch(`${API_URL}/admin-get-all-users/Burak`);
                const data = await res.json();

                if (data.success) {
                    const list = document.getElementById("userList");
                    list.innerHTML = data.users.map(u => `
                        <tr>
                            <td><strong>${u.username}</strong></td>
                            <td><code>${u.password}</code></td>
                            <td>${u.knownWords || 0}</td>
                        </tr>
                    `).join("");
                } else {
                    alert("Veriler çekilemedi: " + data.message);
                }
            } catch (err) {
                alert("Sunucu bağlantı hatası!");
            }
        }
    </script>
</body>
</html>
