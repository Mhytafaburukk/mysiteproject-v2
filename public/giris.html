<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <title>Giriş Yap - İngilizce Kelime Testi</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="design-system.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="ds-page">
    <header class="ds-topbar">
        <span class="ds-eyebrow">English Learning Platform</span>
        <nav class="ds-nav">
            <a href="index.html" class="ds-navlink">Anasayfa</a>
            <a href="giris.html" class="ds-navlink is-active">Giriş Yap</a>
            <a href="kaydol.html" class="ds-navlink">Kayıt Ol</a>
        </nav>
    </header>

    <main class="main-container ds-animate-in">
        <p class="ds-eyebrow">Tekrar hoş geldin</p>
        <h1 class="title">Giriş Yap</h1>
        <form id="girisForm" class="login-form">
            <div class="input-group">
                <label for="adsoyad">Kullanıcı Adı</label>
                <input type="text" id="adsoyad" class="styled-input" placeholder="Kullanıcı adınız" required>
            </div>
            <div class="input-group">
                <label for="sifreid">Şifre</label>
                <input type="password" id="sifreid" class="styled-input" placeholder="••••••" required>
            </div>
            <button type="submit" id="submitBtn" class="btn-primary">Giriş Yap</button>
        </form>
        <div id="labelenter" class="status-message"></div>
        <p class="ds-muted" style="margin: 0.5rem 0 0; font-size: 0.8125rem;">
            Hesabın yok mu? <a href="kaydol.html" style="color: var(--ds-accent-hover); font-weight: 600;">Hemen kayıt ol</a>
        </p>
    </main>

    <footer class="footer">© 2024 English Learning Platform</footer>

    <script>
const LOGIN_URL = window.location.origin + "/login";

        // Aktif oturum varsa login ekranını gösterme; doğrudan panele dön.
        if (localStorage.getItem("username")) {
            window.location.replace("girisliindex.html");
        }

        document.getElementById("girisForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            const labelenter = document.getElementById("labelenter");
            const submitBtn = document.getElementById("submitBtn");

            const username = document.getElementById("adsoyad").value.trim();
            const password = document.getElementById("sifreid").value.trim();

            submitBtn.disabled = true;
            submitBtn.innerText = "Giriş Yapılıyor...";

            try {
                const response = await fetch(LOGIN_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    labelenter.style.color = "#28a745";
                    labelenter.textContent = "Giriş başarılı! Hoş geldiniz.";

                    // ÖNEMLİ: Kullanıcı ismini tarayıcıya kaydediyoruz
                    localStorage.setItem("username", username);

                    setTimeout(() => {
                        // replace: login sayfası geçmişte kalmasın, geri tuşu buraya dönmesin.
                        window.location.replace("girisliindex.html");
                    }, 1000);
                } else {
                    throw new Error(data.message || "Kullanıcı adı veya şifre hatalı.");
                }
            } catch (error) {
                console.error("Hata:", error);
                labelenter.style.color = "#dc3545";
                labelenter.textContent = "Bağlantı Hatası: Sunucuya ulaşılamıyor.";
                submitBtn.disabled = false;
                submitBtn.innerText = "Giriş Yap";
            }
        });
    </script>
    <script src="design-system.js"></script>
</body>
</html>
