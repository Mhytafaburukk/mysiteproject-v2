<!DOCTYPE html>
<html lang="tr">

<head>
    <title>Tüm Kelimeler - İngilizce Kelime Listesi</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Page specific overrides if needed, but mostly relying on style.css */
        .main-container {
            width: 90%;
            max-width: 1000px;
            /* Wider for the table */
        }

        .word-table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        table.word-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .alphabet-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            margin-top: 20px;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 15px;
        }

        .letter-link {
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            color: var(--primary-color);
            border-radius: 50%;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
            cursor: pointer;
        }

        .letter-link:hover,
        .letter-link.active {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
        }

        .search-box {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border-radius: 25px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            margin: 0 auto;
            display: block;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
            outline: none;
            transition: all 0.3s;
        }

        .search-box:focus {
            background: white;
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(106, 17, 203, 0.2);
        }

        .section-header {
            margin-top: 30px;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid var(--secondary-color);
            color: var(--primary-color);
            font-size: 1.5rem;
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="nav-container">
        <a href="girisliindex.html" class="nav-link">Anasayfa</a>
        <a href="kelime.html" class="nav-link">Kelime Testi</a>
        <a href="dinleme_testi.html" class="nav-link">Kelime Eşleştirme</a>
        <a href="TumKelimeler.html" class="nav-link" style="background:white; color:var(--primary-color);">Kelime
            Listesi</a>
    </div>

    <div class="main-container">
        <h1 class="title">Tüm Kelimeler</h1>
        <!-- DİL SEÇİM VE YÖN ÇUBUĞU -->
        <div id="tumKelimelerLangBar" style="margin-bottom: 20px; display: flex; justify-content: center;"></div>
        <p style="margin-bottom: 20px;">Toplam <span id="word-count">...</span> kelime listeleniyor.</p>

        <input type="text" id="searchInput" class="search-box" placeholder="Kelime ara...">

        <div class="alphabet-nav" id="alphabetNav">
            <!-- Alphabet links will be generated here -->
        </div>

        <div id="wordsContainer">
            <!-- Words will be populated here -->
        </div>
    </div>

    <div class="footer">
        © 2024 English Learning Platform
    </div>

    <script src="all_words.js"></script>
    <script src="languages.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('wordsContainer');
            const navContainer = document.getElementById('alphabetNav');
            const searchInput = document.getElementById('searchInput');
            const countSpan = document.getElementById('word-count');

            let wordList = [];
            let userFavorites = [];
            const savedUsername = localStorage.getItem("username");

            function loadActiveWords() {
                if (typeof LanguageManager !== 'undefined') {
                    wordList = LanguageManager.getWordList();
                } else if (typeof comprehensiveWordList !== 'undefined') {
                    wordList = comprehensiveWordList;
                } else {
                    wordList = [];
                }

                // Kelimeleri geçerli dile göre alfabetik sırala
                wordList.sort((a, b) => (a.word || "").localeCompare(b.word || "", 'tr', { sensitivity: 'base' }));
                countSpan.textContent = wordList.length;

                renderAlphabetNav();
                renderWords(searchInput.value || "");
            }

            // Alfabe Harf Navigasyonu Oluşturucu
            function renderAlphabetNav() {
                navContainer.innerHTML = "";
                const letterSet = new Set();
                wordList.forEach(item => {
                    if (item.word) {
                        const first = item.word.trim().charAt(0).toLocaleUpperCase('tr');
                        if (first) letterSet.add(first);
                    }
                });

                const letters = Array.from(letterSet).sort((a, b) => a.localeCompare(b, 'tr'));
                letters.forEach(letter => {
                    const a = document.createElement('a');
                    a.className = 'letter-link';
                    a.textContent = letter;
                    a.onclick = () => {
                        const section = document.getElementById('section-' + encodeURIComponent(letter));
                        if (section) {
                            section.scrollIntoView({ behavior: 'smooth', block: 'start' });
                            document.querySelectorAll('.letter-link').forEach(l => l.classList.remove('active'));
                            a.classList.add('active');
                        }
                    };
                    navContainer.appendChild(a);
                });
            }

            // Fetch user favorites on load
            if (savedUsername) {
                fetch(`${window.location.origin}/get-favorites/${savedUsername}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            userFavorites = data.favorikelimeler || [];
                            renderWords(searchInput.value || "");
                        }
                    })
                    .catch(err => console.error("Favoriler yüklenemedi:", err));
            }

            function renderWords(filterText = "") {
                container.innerHTML = "";
                filterText = filterText.toLowerCase();

                let hasMatches = false;

                // Grup Yapısı
                const grouped = {};
                wordList.forEach(item => {
                    const wLower = (item.word || "").toLowerCase();
                    const mLower = (item.meaning || "").toLowerCase();
                    if (wLower.includes(filterText) || mLower.includes(filterText)) {
                        const firstChar = item.word.trim().charAt(0).toLocaleUpperCase('tr') || '#';
                        if (!grouped[firstChar]) grouped[firstChar] = [];
                        grouped[firstChar].push(item);
                    }
                });

                const prefs = (typeof LanguageManager !== 'undefined') ? LanguageManager.getPreferences() : { learningLang: 'en', nativeLang: 'tr', direction: 'learning_to_native' };
                const isRev = (prefs.direction === 'native_to_learning');
                const sourceMeta = (typeof LanguageManager !== 'undefined') ? LanguageManager.getLanguageMeta(isRev ? prefs.nativeLang : prefs.learningLang) : { flag: '🇬🇧', name: 'İngilizce' };
                const targetMeta = (typeof LanguageManager !== 'undefined') ? LanguageManager.getLanguageMeta(isRev ? prefs.learningLang : prefs.nativeLang) : { flag: '🇹🇷', name: 'Türkçe' };

                const sortedLetters = Object.keys(grouped).sort((a, b) => a.localeCompare(b, 'tr'));

                sortedLetters.forEach(letter => {
                    if (grouped[letter].length > 0) {
                        hasMatches = true;

                        // Section Header
                        const header = document.createElement('h2');
                        header.className = 'section-header';
                        header.id = 'section-' + encodeURIComponent(letter);
                        header.textContent = letter;
                        container.appendChild(header);

                        // Table
                        const tableContainer = document.createElement('div');
                        tableContainer.className = 'word-table-container';

                        const table = document.createElement('table');
                        table.className = 'word-table';

                        table.innerHTML = `
                            <thead>
                                <tr>
                                    <th>${sourceMeta.flag} ${sourceMeta.name}</th>
                                    <th>${targetMeta.flag} ${targetMeta.name}</th>
                                    <th style="width: 50px; text-align: center;">Favori</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        `;

                        const tbody = table.querySelector('tbody');

                        grouped[letter].forEach(w => {
                            const isFav = userFavorites.includes(w.word);
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td><strong>${w.word}</strong></td>
                                <td>${w.meaning}</td>
                                <td style="text-align: center;">
                                    <span class="fav-icon ${isFav ? 'active' : ''}" data-word="${w.word.replace(/"/g, '&quot;')}" style="cursor: pointer; font-size: 1.2rem; color: ${isFav ? 'gold' : '#ccc'};">
                                        ★
                                    </span>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });

                        tableContainer.appendChild(table);
                        container.appendChild(tableContainer);
                    }
                });

                if (!hasMatches) {
                    container.innerHTML = '<p style="margin-top:20px; text-align:center;">Eşleşen kelime bulunamadı.</p>';
                }

                // Add Event Listeners for Stars
                document.querySelectorAll('.fav-icon').forEach(icon => {
                    icon.addEventListener('click', function () {
                        if (!savedUsername) {
                            alert("Favorilere eklemek için lütfen giriş yapın!");
                            return;
                        }

                        const word = this.getAttribute('data-word');
                        const isCurrentlyFav = this.classList.contains('active');

                        if (!isCurrentlyFav) {
                            this.classList.add('active');
                            this.style.color = 'gold';
                            fetch(`${window.location.origin}/add-favorite`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ username: savedUsername, word: word })
                            })
                            .then(res => res.json())
                            .then(data => {
                                if (data.success) {
                                    if (!userFavorites.includes(word)) userFavorites.push(word);
                                } else {
                                    alert(data.message);
                                    this.classList.remove('active');
                                    this.style.color = '#ccc';
                                }
                            });
                        } else {
                            alert("Bu kelime zaten favorilerde ekli.");
                        }
                    });
                });
            }

            // Dil Çubuğunu Oluştur
            if (typeof LanguageManager !== 'undefined') {
                LanguageManager.renderBar("tumKelimelerLangBar", {
                    onDirectionChange: loadActiveWords,
                    onLanguageChange: loadActiveWords
                });
            }

            // Initial Render
            loadActiveWords();

            // Search Functionality
            searchInput.addEventListener('input', (e) => {
                renderWords(e.target.value);
            });
        });
    </script>
    </script>
</body>

</html>
