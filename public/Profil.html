<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İngilizce Kelime Testi - Profil</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* TEMEL STİLLER */
        a:hover, a:visited, a:active, a:link { text-decoration: none; }
        
        #Menu {
            padding: 15px;
            position: absolute;
            right: 0px;
            top: 0px;
            z-index: 20;
        }

        #forbackbutton {
            position: absolute;
            left: 15px;
            top: 15px;
            z-index: 20;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #container {
            padding: 20px;
            border-radius: 10px;
            max-width: 90%;
            width: 500px;
            text-align: center;
            z-index: 10;
            position: relative;
            background: rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(5px);
        }

        .header, #section, #section2, .result1 {
            background: rgba(255, 255, 255, 0.2) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            color: white;
        }

        button {
            color: black;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
        }

        #content1 {
            overflow-y: auto;
            max-height: 150px;
            text-align: left;
        }

        /* PROFİL RESMİ */
        .profile-pic-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            background: #eee;
        }

        .upload-label {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #6a5acd;
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            border: 2px solid white;
        }

        #fileInput { display: none; }

        .egik { border-radius: 10px; color: white; padding: 5px 10px; }

        /* ANİMASYON ELEMENTLERİ */
        p[id^='büyük'], p[id^='kücük'], p[id^='hareketli'] {
            width: 10px; height: 10px; position: fixed; border-radius: 50%; z-index: 0; pointer-events: none;
        }

        /* USERS LİSTESİ TABLO */
        table { width: 100%; color: white; border-collapse: collapse; }
        td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .visit-btn { background-color: #6a5acd; color: white; padding: 5px 10px; font-size: 12px; }

        /* --- Inline SVG ikon rozetleri --- */
        .icon-badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px; border-radius: 7px;
            background: linear-gradient(135deg, rgba(108,92,231,.18), rgba(56,189,248,.12)), rgba(255,255,255,.16);
            border: 1px solid rgba(255,255,255,.28);
            color: #e0e7ff; flex-shrink: 0; vertical-align: -.28em; line-height: 0;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
        }
        .icon-badge svg { width: 13px; height: 13px; display: block; }
        .icon-badge--sm { width: 18px; height: 18px; border-radius: 6px; }
        .icon-badge--sm svg { width: 10.5px; height: 10.5px; }
        .icon-inline { display: inline-block; vertical-align: -.18em; margin: 0 2px; }

        /* ==================================================================
           OBSIDIAN PROFİL — koyu bento estetiği
           ================================================================== */
        body {
            background:
                radial-gradient(1100px 560px at 12% -12%, rgba(124, 92, 255, 0.30), transparent 62%),
                radial-gradient(900px 520px at 100% 0%, rgba(91, 140, 255, 0.18), transparent 58%),
                radial-gradient(700px 420px at 50% 110%, rgba(34, 211, 238, 0.08), transparent 60%),
                #07080B !important;
            color: #F4F5F7;
            height: auto;
            min-height: 100vh;
            overflow-y: auto;
            align-items: flex-start;
            padding: 26px 0;
        }

        #container {
            width: min(680px, calc(100% - 28px)) !important;
            max-width: 680px !important;
            padding: 136px 30px 30px !important;
            border-radius: 30px !important;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, transparent 42%),
                #141418 !important;
            border: 1px solid rgba(255, 255, 255, 0.09) !important;
            box-shadow:
                0 50px 110px -60px rgba(0, 0, 0, 0.95),
                inset 0 1px 0 rgba(255, 255, 255, 0.06) !important;
            overflow: visible !important;
            margin: auto;
        }

        /* Ambient mesh kapak şeridi */
        #container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 182px;
            border-radius: 30px 30px 0 0;
            background:
                radial-gradient(420px 220px at 10% -10%, rgba(124, 92, 255, 0.75), transparent 62%),
                radial-gradient(380px 240px at 88% 10%, rgba(91, 140, 255, 0.55), transparent 64%),
                radial-gradient(320px 200px at 55% 120%, rgba(255, 92, 200, 0.26), transparent 66%),
                linear-gradient(135deg, #191430 0%, #101018 100%);
            border-bottom: 1px solid rgba(124, 92, 255, 0.28);
            pointer-events: none;
            z-index: 0;
        }

        #container > * {
            position: relative;
            z-index: 1;
        }

        /* Neon çerçeveli, kapaktan taşan avatar */
        .profile-pic-container {
            width: 122px;
            height: 122px;
            margin: -96px auto 14px;
            z-index: 3;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #7C5CFF 0%, #5B8CFF 55%, #22D3EE 100%);
            box-shadow:
                0 0 0 1px rgba(124, 92, 255, 0.55),
                0 0 38px rgba(124, 92, 255, 0.6),
                0 24px 44px -20px rgba(0, 0, 0, 0.95);
        }

        .profile-pic {
            border: 3px solid #0B0C10 !important;
            background: #101014;
        }

        .upload-label {
            width: 36px;
            height: 36px;
            right: -2px;
            bottom: 2px;
            background: linear-gradient(135deg, #7C5CFF, #5B8CFF);
            border: 3px solid #141418;
            box-shadow: 0 10px 22px -8px rgba(124, 92, 255, 0.9);
            transition: transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .upload-label:hover { transform: scale(1.1); }

        .header,
        #greeting {
            background: transparent !important;
            border: 0 !important;
            box-shadow: none !important;
            padding: 4px 2px 14px !important;
            font-size: clamp(1.35rem, 3vw, 1.7rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #FFFFFF;
        }

        #section,
        .result1,
        #section2 {
            background: rgba(255, 255, 255, 0.035) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 20px !important;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04) !important;
            padding: 16px !important;
            margin-bottom: 12px;
        }

        #section2 {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: rgba(255, 255, 255, 0.06);
            color: #E8EAF0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 16px;
            font-weight: 600;
            transition:
                transform 260ms cubic-bezier(0.34, 1.56, 0.64, 1),
                background-color 200ms ease,
                border-color 200ms ease,
                box-shadow 200ms ease;
        }

        button:hover {
            transform: translateY(-2px);
            background: rgba(124, 92, 255, 0.18);
            border-color: rgba(124, 92, 255, 0.5);
            box-shadow: 0 14px 28px -16px rgba(124, 92, 255, 0.75);
            color: #FFFFFF;
        }

        button:active { transform: scale(0.97); }

        #followStats > div {
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            padding: 8px 16px;
            color: #A7ADBA;
        }

        #followStats strong {
            color: #C4B5FF;
            font-size: 1.05rem;
            font-variant-numeric: tabular-nums;
        }

        #langStats > div {
            background: rgba(124, 92, 255, 0.12) !important;
            border: 1px solid rgba(124, 92, 255, 0.3) !important;
            border-radius: 999px !important;
            color: #E7E3FF !important;
        }

        #content1 {
            color: #A7ADBA;
            font-size: 0.875rem;
            line-height: 1.6;
            padding: 4px 2px;
        }

        #content1 table { width: 100%; border-collapse: collapse; }

        #content1 td {
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 10px 6px;
        }

        #content1 img { border-radius: 50%; }

        .visit-btn {
            background: rgba(124, 92, 255, 0.2) !important;
            border: 1px solid rgba(124, 92, 255, 0.45);
            color: #DCD6FF !important;
            border-radius: 10px;
        }

        #Deleteaccount {
            background: linear-gradient(135deg, #F2555A, #D33A40) !important;
            border-radius: 12px !important;
            color: #FFFFFF !important;
            box-shadow: 0 12px 26px -14px rgba(242, 85, 90, 0.8);
        }

        #Menu { display: flex; gap: 8px; align-items: center; }

        .egik {
            background: rgba(20, 20, 24, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            color: #E8EAF0;
            padding: 7px 14px;
            font-size: 0.82rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease;
        }

        .egik:hover {
            background: rgba(124, 92, 255, 0.2);
            border-color: rgba(124, 92, 255, 0.5);
            color: #FFFFFF;
        }

        #forbackbutton button {
            background: rgba(20, 20, 24, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #E8EAF0;
            backdrop-filter: blur(12px);
        }

        /* Arka plan partikülleri koyu temada yumuşasın */
        p[id^='büyük'], p[id^='kücük'], p[id^='hareketli'] {
            opacity: 0.35;
            filter: blur(2px);
        }

        @media (max-width: 560px) {
            #container { padding: 122px 18px 20px !important; }
            .profile-pic-container { width: 104px; height: 104px; }
            #Menu { position: static; justify-content: center; padding: 0 0 8px; }
            #forbackbutton { position: static; padding: 0 0 8px; }
        }
    </style>
</head>

<body>
    <p id="büyük"></p><p id="kücük"></p><p id="hareketliKutu"></p><p id="hareketliKutu2"></p>
    <p id="büyük2"></p><p id="büyük3"></p><p id="büyük4"></p><p id="büyük5"></p>
    <p id="büyük6"></p><p id="büyük7"></p><p id="büyük8"></p>

    <div id="forbackbutton">
        <button id="backbutton">Back</button>
    </div>

    <div id="Menu">
        <a href="girisliindex.html" class="egik">Anasayfa</a>
        <a href="kelime.html" class="egik">İngilizce testler</a>
    </div>

    <div id="container">
        <div class="profile-pic-container">
            <img src="https://via.placeholder.com/100" id="profileImage" class="profile-pic">
            <label for="fileInput" class="upload-label">+</label>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="header" id="greeting">Hoşgeldiniz</div>

        <div id="section">
            <button id="Favorikelime">My Favourite Words</button>
            <button id="users">Users</button>
            <div id="followStats" style="margin-top: 15px; display: flex; justify-content: center; gap: 20px;">
                <div id="followersClick" style="cursor: pointer;"><strong id="followerCount">0</strong> Takipçi</div>
                <div id="followingClick" style="cursor: pointer;"><strong id="followingCount">0</strong> Takip Edilen</div>
            </div>
            <div id="langStats" style="margin-top: 15px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.15); display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
                <div style="background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 20px; font-size: 13px;">
                    <span class="icon-badge icon-badge--sm" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10.5 9-7.5 9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg></span> Ana Dil: <span id="userNativeLangBadge" style="font-weight: 600; color: #34d399;">🇹🇷 Türkçe</span>
                </div>
                <div style="background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 20px; font-size: 13px;">
                    <span class="icon-badge icon-badge--sm" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></svg></span> Öğrenilen Dil: <span id="userLearningLangBadge" style="font-weight: 600; color: #38bdf8;">🇬🇧 İngilizce</span>
                </div>
            </div>
        </div>

        <div class="result1">
            <div id="content1">Bir işlem seçin...</div>
        </div>

        <div id="section2">
            <button id="Deleteaccount" style="background-color: #ff4d4d; color: white;">Delete Account</button>
            <button id="language"><span class="icon-badge icon-badge--sm" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18"/><path d="M12 3a15 15 0 0 0 0 18"/></svg></span> Dil Tercihi</button>
        </div>
    </div>

    <script src="languages.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const API_URL = window.location.origin;
            const savedUsername = localStorage.getItem("username") || "Kullanıcı";
            const savedTheme = localStorage.getItem("selectedTheme");
            const profileImage = document.getElementById("profileImage");
            const content1 = document.getElementById("content1");

            function updateLangBadges(nativeCode, learningCode) {
                const nMeta = LanguageManager.getLanguageMeta(nativeCode || "tr");
                const lMeta = LanguageManager.getLanguageMeta(learningCode || "en");
                const nEl = document.getElementById("userNativeLangBadge");
                const lEl = document.getElementById("userLearningLangBadge");
                if (nEl) nEl.textContent = `${nMeta.flag} ${nMeta.name}`;
                if (lEl) lEl.textContent = `${lMeta.flag} ${lMeta.name}`;
            }

            // Başlangıçta localStorage'daki tercihleri göster
            const currentPrefs = LanguageManager.getPreferences();
            updateLangBadges(currentPrefs.nativeLang, currentPrefs.learningLang);

            // TEMA UYGULAMA
            if (savedTheme === 'black') {
                document.body.style.backgroundColor = "#222831";
                document.getElementById("container").style.backgroundColor = "rgba(0,0,0,0.5)";
            } else {
                document.body.style.backgroundColor = "#6482AD";
                document.getElementById("container").style.backgroundColor = "rgba(255,255,255,0.1)";
            }

            // KULLANICI BİLGİLERİNİ VE RESMİ ÇEKME
            function loadUserInfo() {
                fetch(`${API_URL}/get-user-info/${savedUsername}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.success && data.user) {
                            // Eğer veritabanında profil resmi varsa yükle
                            if (data.user.profilePic) {
                                profileImage.src = data.user.profilePic;
                            }
                            document.getElementById("followerCount").textContent = (data.user.followers || []).length;
                            document.getElementById("followingCount").textContent = (data.user.following || []).length;
                            document.getElementById("greeting").textContent = "Hoşgeldiniz, " + savedUsername;

                            // Dil tercihleri veritabanından al ve güncelle
                            if (data.user.nativeLang || data.user.learningLang) {
                                const nLang = data.user.nativeLang || "tr";
                                const lLang = data.user.learningLang || "en";
                                LanguageManager.setPreferences(nLang, lLang, { syncServer: false });
                                updateLangBadges(nLang, lLang);
                            }
                        }
                    })
                    .catch(err => console.error("Bilgi çekme hatası:", err));
            }

            loadUserInfo();

            // DİL TERCİHİ BUTONU
            document.getElementById("language").onclick = function () {
                LanguageManager.openModal(function(newPrefs) {
                    updateLangBadges(newPrefs.nativeLang, newPrefs.learningLang);
                    content1.innerHTML = `<span style='color:#00ff00; font-weight:600;'>✓ Dil tercihleri güncellendi:</span><br>Ana Dil: <strong>${LanguageManager.getLanguageMeta(newPrefs.nativeLang).name}</strong> | Öğrenilen: <strong>${LanguageManager.getLanguageMeta(newPrefs.learningLang).name}</strong>`;
                });
            };

            // PROFİL RESMİ GÜNCELLEME
            document.getElementById("fileInput").addEventListener("change", function () {
                const file = this.files[0];
                if (file) {
                    // Dosya boyutu kontrolü (Örn: Max 2MB)
                    if (file.size > 2 * 1024 * 1024) {
                        content1.innerHTML = "<span style='color:red;'>Hata: Dosya boyutu çok büyük (Max 2MB).</span>";
                        return;
                    }

                    const reader = new FileReader();
                    content1.innerHTML = "Resim yükleniyor...";

                    reader.onload = function (e) {
                        const base64Image = e.target.result;

                        fetch(`${API_URL}/update-profile-pic`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ 
                                username: savedUsername, 
                                imageBase64: base64Image 
                            })
                        })
                        .then(res => res.json())
                        .then(data => {
                            if(data.success) {
                                profileImage.src = base64Image;
                                content1.innerHTML = "<span style='color:#00ff00;'>Profil resmi başarıyla güncellendi!</span>";
                            } else {
                                content1.innerHTML = "<span style='color:red;'>Yükleme hatası: " + data.message + "</span>";
                            }
                        })
                        .catch(err => {
                            content1.innerHTML = "<span style='color:red;'>Sunucu hatası oluştu.</span>";
                        });
                    };
                    reader.readAsDataURL(file);
                }
            });

            // USERS LİSTESİ
            document.getElementById("users").onclick = function () {
                content1.innerHTML = "Kullanıcılar listeleniyor...";
                fetch(`${API_URL}/users`)
                    .then(res => res.json())
                    .then(usersArray => {
                        const others = usersArray.filter(u => u.username !== savedUsername);
                        let html = "<table>";
                        others.forEach(u => {
                            const miniPic = u.profilePic ? u.profilePic : 'https://via.placeholder.com/30';
                            const isBot = (u.username === "English_AI" || u.username === "English_Mentor" || u.isAI);
                            const badge = isBot ? `<span style="background:linear-gradient(135deg, #0284c7, #2563eb); color:white; font-size:10px; padding:2px 7px; border-radius:10px; margin-left:6px; font-weight:600;">✓ Eğitmen</span>` : '';
                            const btnText = isBot ? "Konuş 🎓" : "Ziyaret Et";
                            const btnColor = isBot ? "background-color: #4f46e5;" : "background-color: #6a5acd;";

                            html += `<tr>
                                <td><img src="${miniPic}" style="width:30px; height:30px; border-radius:50%; vertical-align:middle; margin-right:10px;"><strong>${u.username}</strong>${badge}</td>
                                <td align="right"><button class="visit-btn" data-user="${u.username}" data-isai="${isBot}" style="${btnColor}">${btnText}</button></td>
                            </tr>`;
                        });
                        html += "</table>";
                        content1.innerHTML = html;

                        document.querySelectorAll(".visit-btn").forEach(btn => {
                            btn.onclick = function() {
                                const targetUser = this.getAttribute("data-user");
                                const isAi = this.getAttribute("data-isai") === "true";
                                localStorage.setItem("currentusername", targetUser);
                                if (isAi) {
                                    window.location.href = "Message.html";
                                } else {
                                    window.location.href = "Otherprofiles.html";
                                }
                            };
                        });
                    });
            };

            // HESAP SİLME
            document.getElementById("Deleteaccount").onclick = function () {
                const confirmation = confirm("Hesabınızı silmek istediğinize emin misiniz?");
                if (confirmation) {
                    fetch(`${API_URL}/delete-account`, {
                        method: "DELETE",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username: savedUsername })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            alert("Hesabınız silindi.");
                            localStorage.clear();
                            window.location.href = "index.html";
                        }
                    });
                }
            };

            // ANİMASYON
            function hareket(box) {
                let t = Math.random()*500, l = Math.random()*800, vd=1, hd=1;
                setInterval(() => {
                    l += 2*hd; t += 2*vd;
                    if(l <= 0 || l+30 >= window.innerWidth) hd *= -1;
                    if(t <= 0 || t+30 >= window.innerHeight) vd *= -1;
                    box.style.top = t+"px"; box.style.left = l+"px";
                }, 100);
            }
            document.querySelectorAll("p[id^='büyük'], p[id^='hareketli'], p[id^='kücük']").forEach(p => {
                hareket(p);
                p.style.boxShadow = (savedTheme === 'black') ? "0 0 30px 15px #76ABAE" : "0 0 30px 15px #E2DAD6";
            });

            document.getElementById("backbutton").onclick = () => window.location.href = "girisliindex.html";
        });
    </script>
    <script src="design-system.js"></script>
</body>
</html>
