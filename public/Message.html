<!DOCTYPE html>
<html lang="tr">

<head>
    <title>İngilizce Mentorluk & Mesajlaşma</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            --accent: #38bdf8;
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --msg-sent: #4338ca;
            --msg-received: #1e293b;
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 15%, #1e1b4b 0%, #0f172a 100%);
            color: var(--text-light);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 0;
        }

        #messagediv {
            width: 100%;
            max-width: 680px;
            height: 100vh;
            height: 100dvh;
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        @media (min-width: 768px) {
            #messagediv {
                height: 94vh;
                border-radius: 24px;
                border: 1px solid rgba(255, 255, 255, 0.15);
            }
        }

        /* Header */
        .chat-header {
            background: rgba(30, 41, 59, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
        }

        .avatar-wrap {
            position: relative;
            width: 44px;
            height: 44px;
            flex-shrink: 0;
        }

        .header-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #6366f1;
            background: #1e293b;
        }

        .online-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12px;
            height: 12px;
            background: #10b981;
            border-radius: 50%;
            border: 2px solid #0f172a;
        }

        .user-meta {
            flex: 1;
            min-width: 0;
        }

        .user-title-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .user-name {
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-verified {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: white;
            font-size: 10px;
            width: 17px;
            height: 17px;
            border-radius: 50%;
            font-weight: bold;
            box-shadow: 0 0 8px rgba(37, 99, 235, 0.5);
            flex-shrink: 0;
        }

        .badge-mentor {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.35);
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        .user-status {
            font-size: 0.78rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .config-btn {
            background: rgba(99, 102, 241, 0.18);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #e0e7ff;
            padding: 7px 14px;
            border-radius: 14px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .config-btn:hover {
            background: var(--primary);
            color: #ffffff;
        }

        /* Hızlı Eylemler (Quick Actions Bar) */
        .quick-actions-bar {
            background: rgba(15, 23, 42, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 12px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .quick-actions-bar::-webkit-scrollbar { display: none; }

        .quick-pill {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #e2e8f0;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .quick-pill:hover {
            background: rgba(79, 70, 229, 0.35);
            border-color: #6366f1;
            color: #ffffff;
            transform: translateY(-1px);
        }

        /* Sohbet Alanı */
        .chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 86%;
        }

        .message-sent {
            align-self: flex-end;
        }

        .message-received {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.94rem;
            line-height: 1.55;
            word-wrap: break-word;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            position: relative;
        }

        .message-sent .message-bubble {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message-received .message-bubble {
            background: #1e293b;
            color: #f1f5f9;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .message-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            font-size: 0.72rem;
            color: var(--text-dim);
            padding: 0 4px;
        }

        .message-sent .message-meta {
            justify-content: flex-end;
        }

        .tts-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #38bdf8;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: 0.2s;
        }
        .tts-btn:hover { color: #ffffff; transform: scale(1.05); }

        /* Mesaj Giriş Alanı */
        .chat-footer {
            background: rgba(30, 41, 59, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-box {
            flex: 1;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 11px 18px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .input-box:focus {
            border-color: #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.35);
        }

        .input-box::placeholder {
            color: #64748b;
        }

        .btn-action {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-send {
            background: linear-gradient(135deg, #4f46e5 0%, #38bdf8 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
        }
        .btn-send:hover {
            transform: scale(1.05);
        }

        .btn-voice {
            background: rgba(255, 255, 255, 0.08);
            color: #38bdf8;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* MODAL (AYARLAR) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 22px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }

        .modal-header h3 {
            font-size: 1.15rem;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.85rem;
            color: #cbd5e1;
            font-weight: 500;
        }

        .form-select, .form-input {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 14px;
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        .form-select:focus, .form-input:focus {
            border-color: #6366f1;
        }

        .btn-modal-save {
            background: linear-gradient(135deg, #4f46e5 0%, #0284c7 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .api-info-text {
            font-size: 0.78rem;
            color: #94a3b8;
            line-height: 1.4;
        }

        .api-info-text a {
            color: #38bdf8;
            text-decoration: underline;
        }

        /* MOBİL UYUM */
        @media (max-width: 600px) {
            .chat-header { padding: 10px 12px; gap: 8px; }
            .header-avatar { width: 38px; height: 38px; }
            .user-name { font-size: 0.92rem; }
            .config-btn span.full-text { display: none; }
            .message-bubble { font-size: 0.88rem; padding: 10px 14px; }
            .input-box { font-size: 0.9rem; padding: 9px 14px; }
            .btn-action { width: 38px; height: 38px; }
        }
    </style>
</head>

<body>

    <div id="messagediv">
        <!-- HEADER -->
        <header class="chat-header">
            <button class="btn-icon" onclick="window.location.href='girisliindex.html'" title="Panele Dön">←</button>
            
            <div class="avatar-wrap">
                <img id="header-pic" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><circle cx='60' cy='60' r='58' fill='%231e293b' stroke='%234f46e5' stroke-width='4'/><circle cx='60' cy='60' r='52' fill='%230f172a'/><path d='M60 28 L90 44 L60 60 L30 44 Z' fill='%236366f1'/><path d='M42 54 L42 72 Q60 84 78 72 L78 54 Q60 66 42 54 Z' fill='%23e0e7ff'/><circle cx='60' cy='92' r='4' fill='%2338bdf8'/><path d='M90 44 L90 68' stroke='%2338bdf8' stroke-width='3' stroke-linecap='round'/></svg>" class="header-avatar" alt="Avatar">
                <div class="online-dot" id="onlineDot"></div>
            </div>

            <div class="user-meta">
                <div class="user-title-row">
                    <span class="user-name" id="partnerName">English Mentor</span>
                    <span class="badge-verified" id="verifiedBadge" title="Doğrulanmış Resmi Mentor">✓</span>
                    <span class="badge-mentor" id="mentorBadge">Eğitmen</span>
                </div>
                <div class="user-status" id="userStatus">
                    <span>🟢 Çevrimiçi</span> • <span id="currentModelLabel">Gemini 1.5 Flash</span>
                </div>
            </div>

            <!-- MODEL AYARLARI BUTONU -->
            <button class="config-btn" id="openSettingsBtn">
                ⚙️ <span class="full-text">Model & API</span>
            </button>

            <button class="btn-icon" id="refreshBtn" title="Sohbeti Yenile">↻</button>
        </header>

        <!-- HIZLI PRATİK VE AKSİYON ÇUBUĞU -->
        <div class="quick-actions-bar" id="quickActionsBar">
            <div class="quick-pill" onclick="sendQuickPrompt('Bana bir kelime seç ve farklı seviyelerde örnek cümle içinde kullan!')">
                📝 <span>Örnek Cümle İste</span>
            </div>
            <div class="quick-pill" onclick="sendQuickPrompt('Son yazdığım İngilizce cümledeki gramer hatalarını inceleyip düzelt!')">
                🔍 <span>Gramerimi Kontrol Et</span>
            </div>
            <div class="quick-pill" onclick="sendQuickPrompt('Bugün öğrenmem gereken harika bir kelime, anlamı ve örnek cümlesi nedir?')">
                🌟 <span>Günün Kelimesi</span>
            </div>
            <div class="quick-pill" onclick="sendQuickPrompt('Can we have a casual conversation in English? Please ask me an engaging question!')">
                💬 <span>İngilizce Konuşalım</span>
            </div>
            <div class="quick-pill" onclick="sendQuickPrompt('Günlük hayatta sık kullanılan bir İngilizce deyim (idiom) ve örneğini öğret!')">
                ⚡ <span>Deyim Öğren</span>
            </div>
        </div>

        <!-- SOHBET ALANI -->
        <main class="chat-body" id="chatBody"></main>

        <!-- MESAJ GİRİŞ FOOTER -->
        <footer class="chat-footer">
            <div class="input-row">
                <input type="text" id="msgInput" class="input-box" placeholder="Bir kelime veya cümle yazın (Örn: involvement ile cümle kur)..." autocomplete="off">
                <button id="voiceBtn" class="btn-action btn-voice" title="Sesli Mesaj">🎤</button>
                <button id="stopVoiceBtn" class="btn-action" style="background:#ef4444; color:white; display:none;" title="Durdur">■</button>
                <button id="sendBtn" class="btn-action btn-send" title="Gönder">➤</button>
            </div>
        </footer>
    </div>

    <!-- MODEL & API KEY AYARLARI MODALI -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>⚙️ AI Model & API Ayarları</h3>
                <button class="btn-icon" id="closeSettingsBtn" style="width:32px; height:32px;">✕</button>
            </div>

            <div class="form-group">
                <label class="form-label">Yapay Zeka Modeli:</label>
                <select id="modelSelect" class="form-select">
                    <option value="gemini-1.5-flash">⚡ Google Gemini 1.5 Flash (Önerilen - Ücretsiz & Hızlı)</option>
                    <option value="gemini-1.5-pro">🧠 Google Gemini 1.5 Pro (Derin Gramer Analizi)</option>
                    <option value="gemini-2.0-flash">🚀 Google Gemini 2.0 Flash</option>
                    <option value="gpt-4o-mini">🤖 OpenAI GPT-4o Mini</option>
                    <option value="gpt-4o">🌟 OpenAI GPT-4o</option>
                    <option value="built-in">💻 Dahili Akıllı Motor (API Key Gerekmez)</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">API Anahtarınız (API Key):</label>
                <input type="password" id="apiKeyInput" class="form-input" placeholder="Gemini veya OpenAI API Key girin...">
                <div class="api-info-text">
                    🔑 Gemini API anahtarınızı <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>'dan <strong>ücretsiz</strong> alabilirsiniz.
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Mentor Odak Modu:</label>
                <select id="focusModeSelect" class="form-select">
                    <option value="coach">🎯 Gramer & Cümle Koçu (Detaylı düzeltme ve örnek cümleler)</option>
                    <option value="casual">💬 Doğal Konuşma Partneri (Akıcı günlük diyalog)</option>
                    <option value="exam">📚 Sınav ve Kelime Hazırlığı (TOEFL / IELTS / YDS)</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">İngilizce Seviyeniz:</label>
                <select id="levelSelect" class="form-select">
                    <option value="auto">🌐 Otomatik (Seviyeme göre ayarla)</option>
                    <option value="A1-A2">A1 - A2 (Başlangıç)</option>
                    <option value="B1-B2">B1 - B2 (Orta Düzey)</option>
                    <option value="C1-C2">C1 - C2 (İleri Düzey)</option>
                </select>
            </div>

            <button class="btn-modal-save" id="saveSettingsBtn">💾 Ayarları Kaydet</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const API_URL = window.location.origin;
            const chatBody = document.getElementById("chatBody");
            const msgInput = document.getElementById("msgInput");
            const sendBtn = document.getElementById("sendBtn");
            const partnerNameEl = document.getElementById("partnerName");
            const verifiedBadge = document.getElementById("verifiedBadge");
            const mentorBadge = document.getElementById("mentorBadge");
            const voiceBtn = document.getElementById("voiceBtn");
            const stopVoiceBtn = document.getElementById("stopVoiceBtn");
            const currentModelLabel = document.getElementById("currentModelLabel");

            // Modal Elementleri
            const settingsModal = document.getElementById("settingsModal");
            const openSettingsBtn = document.getElementById("openSettingsBtn");
            const closeSettingsBtn = document.getElementById("closeSettingsBtn");
            const saveSettingsBtn = document.getElementById("saveSettingsBtn");
            const modelSelect = document.getElementById("modelSelect");
            const apiKeyInput = document.getElementById("apiKeyInput");
            const focusModeSelect = document.getElementById("focusModeSelect");
            const levelSelect = document.getElementById("levelSelect");

            let savedUsername = localStorage.getItem("username") || "Kullanıcı";
            let rawPartner = localStorage.getItem("currentusername") || "English_Mentor";
            if (rawPartner === "English_AI") rawPartner = "English_Mentor";
            let currentPartner = rawPartner;

            let lastMsgCount = 0;
            let mediaRecorder;
            let audioChunks = [];

            // AI AYARLARI
            let userApiKey = localStorage.getItem("ai_api_key") || "";
            let selectedModel = localStorage.getItem("ai_selected_model") || "gemini-1.5-flash";
            let focusMode = localStorage.getItem("ai_focus_mode") || "coach";
            let englishLevel = localStorage.getItem("ai_level") || "auto";

            apiKeyInput.value = userApiKey;
            modelSelect.value = selectedModel;
            focusModeSelect.value = focusMode;
            levelSelect.value = englishLevel;
            updateModelLabel();

            function updateModelLabel() {
                const labels = {
                    "gemini-1.5-flash": "Gemini 1.5 Flash ⚡",
                    "gemini-1.5-pro": "Gemini 1.5 Pro 🧠",
                    "gemini-2.0-flash": "Gemini 2.0 Flash 🚀",
                    "gpt-4o-mini": "GPT-4o Mini 🤖",
                    "gpt-4o": "GPT-4o 🌟",
                    "built-in": "Dahili Motor 💻"
                };
                currentModelLabel.textContent = labels[selectedModel] || selectedModel;
            }

            openSettingsBtn.onclick = () => settingsModal.style.display = "flex";
            closeSettingsBtn.onclick = () => settingsModal.style.display = "none";
            settingsModal.onclick = (e) => { if (e.target === settingsModal) settingsModal.style.display = "none"; };

            saveSettingsBtn.onclick = () => {
                userApiKey = apiKeyInput.value.trim();
                selectedModel = modelSelect.value;
                focusMode = focusModeSelect.value;
                englishLevel = levelSelect.value;

                localStorage.setItem("ai_api_key", userApiKey);
                localStorage.setItem("ai_selected_model", selectedModel);
                localStorage.setItem("ai_focus_mode", focusMode);
                localStorage.setItem("ai_level", englishLevel);

                updateModelLabel();
                settingsModal.style.display = "none";
                alert("✅ Model ayarlarınız güncellendi!");
            };

            const isMentor = (currentPartner === "English_Mentor" || currentPartner === "English_AI");
            partnerNameEl.textContent = isMentor ? "English Mentor" : currentPartner;

            if (isMentor) {
                verifiedBadge.style.display = "inline-flex";
                mentorBadge.style.display = "inline-block";
            } else {
                verifiedBadge.style.display = "none";
                mentorBadge.style.display = "none";
                document.getElementById("quickActionsBar").style.display = "none";
            }

            // SESLİ OKUMA (TTS)
            window.speakText = function(text) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const clean = text.replace(/[*#_`>]/g, "");
                    const utter = new SpeechSynthesisUtterance(clean);
                    utter.lang = 'en-US';
                    utter.rate = 0.95;
                    window.speechSynthesis.speak(utter);
                }
            };

            window.sendQuickPrompt = function(promptText) {
                msgInput.value = promptText;
                sendMessage();
            };

            // MESAJLARI ÇEK
            function fetchMessages() {
                fetch(`${API_URL}/get-messages/${savedUsername}/${currentPartner}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.success && data.messages) {
                            if (data.messages.length !== lastMsgCount) {
                                renderMessages(data.messages);
                                lastMsgCount = data.messages.length;
                            }
                        }
                    })
                    .catch(err => console.error("Mesaj çekme hatası:", err));
            }

            function renderMessages(messages) {
                chatBody.innerHTML = messages.map((msg) => {
                    const isMe = msg.sender === savedUsername;
                    const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    let content = msg.content;

                    if (content.includes("[SES:")) {
                        const audioData = content.replace("[SES:", "").replace("]", "");
                        content = `<audio src="${audioData}" controls style="width:200px; height:36px;"></audio>`;
                    } else {
                        // Markdown Biçimlendirmeleri
                        content = content
                            .replace(/^>\s?(.*)$/gm, '<blockquote style="border-left: 3px solid #38bdf8; padding-left: 8px; margin: 6px 0; color: #cbd5e1;">$1</blockquote>')
                            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                            .replace(/\*(.*?)\*/g, '<em>$1</em>')
                            .replace(/\n/g, '<br>');
                    }

                    return `
                        <div class="message-row ${isMe ? 'message-sent' : 'message-received'}">
                            <div class="message-bubble">
                                ${content}
                            </div>
                            <div class="message-meta">
                                <span>${time}</span>
                                ${!isMe && !content.includes("<audio") ? `<button class="tts-btn" onclick="speakText('${msg.content.replace(/'/g, "\\'")}')" title="İngilizce Telaffuzu Dinle">🔊 Dinle</button>` : ''}
                            </div>
                        </div>
                    `;
                }).join("");

                chatBody.scrollTop = chatBody.scrollHeight;
            }

            // MESAJ GÖNDERME (API KEY VE MODEL PARAMETRELERİ DAHİL)
            async function sendMessage() {
                const text = msgInput.value.trim();
                if (!text) return;

                msgInput.value = "";

                // Mesaj alanına geçici olarak kullanıcı mesajını ve "Mentor yazıyor..." gösterelim
                const tempTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                chatBody.innerHTML += `
                    <div class="message-row message-sent">
                        <div class="message-bubble">${text}</div>
                        <div class="message-meta"><span>${tempTime}</span></div>
                    </div>
                    <div class="message-row message-received" id="typingIndicator">
                        <div class="message-bubble" style="opacity: 0.8; font-style: italic;">
                            Mentor yanıtı hazırlıyor... ✍️
                        </div>
                    </div>
                `;
                chatBody.scrollTop = chatBody.scrollHeight;

                try {
                    const response = await fetch(`${API_URL}/send-message`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ 
                            sender: savedUsername, 
                            receiver: currentPartner, 
                            content: text,
                            apiKey: userApiKey,
                            model: selectedModel,
                            focusMode: focusMode,
                            englishLevel: englishLevel
                        })
                    });

                    const data = await response.json();
                    const indicator = document.getElementById("typingIndicator");
                    if (indicator) indicator.remove();

                    if (data.success) {
                        fetchMessages();
                    }
                } catch (e) {
                    console.error("Mesaj gönderme hatası:", e);
                    const indicator = document.getElementById("typingIndicator");
                    if (indicator) indicator.remove();
                    fetchMessages();
                }
            }

            sendBtn.onclick = sendMessage;
            msgInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
            document.getElementById("refreshBtn").onclick = fetchMessages;

            // SESLİ MESAJ
            voiceBtn.onclick = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                    mediaRecorder.onstop = () => {
                        stream.getTracks().forEach(t => t.stop());
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(blob);
                        reader.onloadend = () => {
                            const base64 = reader.result;
                            fetch(`${API_URL}/send-message`, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ 
                                    sender: savedUsername, 
                                    receiver: currentPartner, 
                                    content: `[SES:${base64}]`,
                                    apiKey: userApiKey,
                                    model: selectedModel
                                })
                            }).then(() => fetchMessages());
                        };
                    };
                    mediaRecorder.start();
                    voiceBtn.style.display = "none";
                    stopVoiceBtn.style.display = "flex";
                } catch (err) {
                    alert("Mikrofon erişimi sağlanamadı: " + err.message);
                }
            };

            stopVoiceBtn.onclick = () => {
                if (mediaRecorder) mediaRecorder.stop();
                stopVoiceBtn.style.display = "none";
                voiceBtn.style.display = "flex";
            };

            fetchMessages();
            setInterval(fetchMessages, 3500);
        });
    </script>
</body>

</html>
